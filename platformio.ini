; MIASMORA — Dark Ambient Drone Generator for M5Stack Cardputer ADV
; Build with PlatformIO (VSCode). After a successful build you will find:
;   .pio/build/m5stack-cardputer-adv/firmware.bin  -> for Launcher FW
;   .pio/build/m5stack-cardputer-adv/merge.bin     -> for M5Burner (bootloader+partitions+app merged)

[env:m5stack-cardputer-adv]
platform = espressif32
board = m5stack-stamps3
framework = arduino
monitor_speed = 921600
upload_speed = 921600

board_build.partitions = default_8MB.csv
board_build.flash_mode = dio
board_upload.flash_size = 8MB

; The Arduino builder appends -Os after build_flags, which overrode the -O2
; below until v0.31. Remove it: the whole firmware is built for speed (v0.32b;
; measured lighter than speed-optimising the DSP sources alone, src/dsp/speed.h,
; which stays as a safeguard).
build_unflags = -Os

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2

lib_deps =
    m5stack/M5Cardputer
    m5stack/M5Unified
    m5stack/M5GFX
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit NeoPixel@^1.12.0

extra_scripts = post:merge_bin.py
